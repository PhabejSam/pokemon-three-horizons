name: Three Horizons demo
on:
  push:
    branches: [feature/opening-demo]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev pkg-config python3 git
          { uname -a; gcc --version; arm-none-eabi-gcc --version; make --version; python3 --version; dpkg-query -W build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev; } > demo-environment.txt
      - name: Check map contracts
        run: |
          make -C tools/mapjson
          python3 -m unittest discover -s tools/three_horizons/tests -v
      - name: Build demo
        shell: bash
        run: |
          set -o pipefail
          make THREE_HORIZONS=1 -j2 -O all 2>&1 | tee demo-build.log
          test -s pokemon-three-horizons.gba
          git diff --exit-code
          sha256sum pokemon-three-horizons.gba > pokemon-three-horizons.gba.sha256
          git rev-parse HEAD > demo-source-commit.txt
      - name: Test opening progression
        shell: bash
        run: |
          set -o pipefail
          make THREE_HORIZONS=1 check TESTS="Three Horizons" -j2 2>&1 | tee demo-tests.log
          make THREE_HORIZONS=1 check TESTS="test/save.c" -j2 2>&1 | tee -a demo-tests.log
          ! grep -q "No tests found" demo-tests.log
      - name: Verify first-battle regression catches the original overwrite
        shell: bash
        run: |
          set -o pipefail
          cp src/battle_controllers.c /tmp/th-battle-controllers.c
          trap 'cp /tmp/th-battle-controllers.c src/battle_controllers.c' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/battle_controllers.c')
          s = p.read_text()
          original = 'if (!IS_FRLG && (gBattleTypeFlags & BATTLE_TYPE_FIRST_BATTLE)\n        && !(gBattleTypeFlags & BATTLE_TYPE_TRAINER))'
          assert original in s
          p.write_text(s.replace(original, 'if (!IS_FRLG && (gBattleTypeFlags & BATTLE_TYPE_FIRST_BATTLE))'))
          PY
          if make THREE_HORIZONS=1 check TESTS="Three Horizons first rival battle initialization" -j2 > regression-negative.log 2>&1; then
            echo "Regression failed to detect the overwrite"; exit 1
          fi
          grep -q 'FAIL' regression-negative.log
          cp /tmp/th-battle-controllers.c src/battle_controllers.c
          make THREE_HORIZONS=1 check TESTS="Three Horizons first rival battle initialization" -j2 > regression-positive.log 2>&1
          git diff --exit-code
      - name: Check trainer regeneration when switching build modes
        shell: bash
        run: |
          set -o pipefail
          make THREE_HORIZONS=0 generated > trainer-mode-switch.log 2>&1
          ! grep -q 'TRAINER_TH_ROBIN_BULBASAUR' src/data/trainers.h
          make THREE_HORIZONS=1 generated >> trainer-mode-switch.log 2>&1
          grep -q 'TRAINER_TH_ROBIN_BULBASAUR' src/data/trainers.h
          grep -q 'JOEY' src/data/trainers.h
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-horizons-opening
          retention-days: 14
          path: |
            pokemon-three-horizons.gba
            pokemon-three-horizons.elf
            pokemon-three-horizons.map
            pokemon-three-horizons.gba.sha256
            demo-build.log
            demo-tests.log
            demo-source-commit.txt
            demo-environment.txt
            trainer-mode-switch.log
            regression-negative.log
            regression-positive.log
            docs/three_horizons/OPENING_DEMO_TESTS.md
